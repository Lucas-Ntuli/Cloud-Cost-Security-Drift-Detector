name: Drift and Security Scan

on:
 schedule:
   - cron: "0 6 * * *"
 workflow_dispatch: {}
 push: 
   branches: [main]
   paths:
     - "terraform/**"
     - "scanner/**"

permissions:
 id-token: write
 contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login 
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: terraform Plan
        working-directory: terraform
        run: terraform -out=tfplan -detailed-exitcode
        continue-on-error: true
        id: tfplan

      - name: Terraform state to JSON
        working-directory: terraform
        run: terraform show -json terraform.tfstate > terraform.tfstate.json || terraform show -json > terraform.tfstate.json

      - name: Build scanner image
        run: docker build -t drift-scanner ./scanner

      - name: run scanner
        run: |
          docker run --rm \
            -e AZURE_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            -e TARGET_RESOURCE_GROUP=${{ vars.TARGET_RESOURCE_GROUP }} \
            -e SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }} \
            -e TF_STATE_PATH=/workspace/terraform.tfstate.json \
            -e REPORT_OUTPUT_PATH=/workspace/report.md \
            -v ${{ github.workspace }}/terraform:/workspace \
            drift-scanner
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: terraform/report.md
